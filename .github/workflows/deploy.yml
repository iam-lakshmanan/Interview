name: Build and Deploy

on:
  push:
    branches:
      - main


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/interview:latest
            ${{ vars.DOCKERHUB_USERNAME }}/interview:${{ github.sha }}
  

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            'bash -s' <<'EOF'
          set -e

          IMAGE="${{ vars.DOCKERHUB_USERNAME }}/interview:latest"
          

          echo "Deploying image: $IMAGE"


          docker pull "$IMAGE"

          docker rm -f interview 2>/dev/null || true

          docker run -d \
            --name interview \
            --restart unless-stopped \
            -p 3001:3001 \
            --env-file "$ENV_FILE" \
            "$IMAGE"

          docker image prune -f

          echo "Deployment completed successfully"
          docker ps --filter "name=interview"
          EOF